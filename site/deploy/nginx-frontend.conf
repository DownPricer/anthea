# Nginx dans le conteneur « web » : fichiers statiques React + proxy vers FastAPI
# Même origine pour le navigateur (cookies HttpOnly sur /api).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API FastAPI (préfixe /api dans l’app)
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA — historique HTML5
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de cache agressif pour index.html (déploiements)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
