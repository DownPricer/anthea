# Reverse proxy public — à copier sur le VPS vers :
#   /opt/downpricer/nginx/conf.d/anthea.conf
#
# Prérequis : le conteneur « anthea-web » est sur le même réseau Docker que
# « downpricer-nginx » (variable EXTERNAL_PROXY_NETWORK dans /opt/anthea/.../deploy/.env).
#
# Rechargement :
#   docker exec downpricer-nginx nginx -t
#   docker exec downpricer-nginx nginx -s reload
#
# Test depuis l’hôte (port HTTP publié par downpricer-nginx, souvent 80) :
#   curl -sS -H 'Host: anthea.sitereadyshd.fr' http://127.0.0.1/
#   curl -sS -H 'Host: anthea.sitereadyshd.fr' http://127.0.0.1/api/

upstream anthea_web {
    server anthea-web:80;
    keepalive 8;
}

server {
    listen 80;
    server_name anthea.sitereadyshd.fr;

    location / {
        proxy_pass http://anthea_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

