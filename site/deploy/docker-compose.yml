# Anthea — stack production (MongoDB + FastAPI + Nginx / SPA)
# Utilisation : depuis ce dossier (`site/deploy/`) : docker compose up -d --build
#
# Le service « web » n’expose aucun port sur l’hôte : il est joint uniquement via
# le réseau Docker externe partagé avec le conteneur downpricer-nginx.
# Renseigner EXTERNAL_PROXY_NETWORK dans .env (voir .env.example).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - anthea_internal

  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-anthea}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fitgather.fr,https://www.fitgather.fr,https://anthea.sitereadyshd.fr,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-1440}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://fitgather.fr}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FitGather}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-60}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      QA_EMAIL_BYPASS_ENABLED: ${QA_EMAIL_BYPASS_ENABLED:-false}
      QA_EMAIL_BYPASS_ALLOWLIST: ${QA_EMAIL_BYPASS_ALLOWLIST:-}
      QA_EMAIL_BYPASS_UNTIL: ${QA_EMAIL_BYPASS_UNTIL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://anthea.sitereadyshd.fr}
      EXERCISE_PROVIDER: ${EXERCISE_PROVIDER:-exercisedb}
      EXERCISE_PROVIDER_BASE_URL: ${EXERCISE_PROVIDER_BASE_URL:-https://oss.exercisedb.dev/api/v1}
      EXERCISE_PROVIDER_API_KEY: ${EXERCISE_PROVIDER_API_KEY:-}
      EXERCISE_MEDIA_MODE: ${EXERCISE_MEDIA_MODE:-remote}
      EXERCISE_CUSTOM_CREATION_ENABLED: ${EXERCISE_CUSTOM_CREATION_ENABLED:-false}
    volumes:
      - ../backend/uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - anthea_internal

  web:
    container_name: anthea-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ""
        REACT_APP_VAPID_PUBLIC_KEY: ${REACT_APP_VAPID_PUBLIC_KEY:?set REACT_APP_VAPID_PUBLIC_KEY in .env}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      anthea_internal:
      proxy_net:

volumes:
  mongo_data:

networks:
  anthea_internal:
    driver: bridge
  proxy_net:
    external: true
    name: ${EXTERNAL_PROXY_NETWORK:?set EXTERNAL_PROXY_NETWORK in .env}
